version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
    env_file:
      - ../.env
    environment:
      - APP_PORT=${PORT:-8000}
      - DB_PATH=/app/data/threats.db
      - ENV=${ENV:-production}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
