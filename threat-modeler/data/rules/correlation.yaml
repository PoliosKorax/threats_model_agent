# Правила корреляции (Таблицы 3, 4, 8 ФСТЭК)

# Карта последствий: Объект -> Воздействие -> [Последствия]
consequence_map:
  О1:  # Персональные данные
    В1: [П1, П2, П7]
    В2: [П3, П11]
    В3: [П4, П8]
  
  О2:  # Информационные системы
    В1: [П2, П14]
    В2: [П3, П12]
    В3: [П4, П13]
    В4: [П15]
  
  О6:  # Программное обеспечение
    В1: [П14]
    В2: [П3, П12]
    В3: [П4]
    В4: [П15]
  
  О7:  # Средства защиты информации
    В1: [П2, П10]
    В2: [П3]
    В3: [П4]
  
  О8:  # Криптографические средства
    В1: [П2, П9, П10]
    В2: [П3]
    В3: [П4]

# Уровни нарушителей и их возможности
violator_capabilities:
  Н1:
    methods: [СП1, СП2, СП3, СП4, СП5, СП6, СП7, СП8, СП9]
    objects: [О1, О2, О3, О4, О5, О6, О7, О8, О9, О10, О11, О12, О13, О14, О15, О16, О17]
  
  Н2:
    methods: [СП1, СП2, СП3, СП4, СП5, СП6, СП7, СП8, СП9]
    objects: [О1, О2, О3, О4, О5, О6, О7, О8, О9, О10, О11, О12, О13, О14, О15, О16, О17]
  
  Н3:
    methods: [СП1, СП3, СП4, СП5, СП7, СП8, СП9]
    objects: [О1, О2, О3, О5, О6, О7, О9, О10, О11, О13, О14, О15, О16]
  
  Н4:
    methods: [СП1, СП4, СП5, СП7]
    objects: [О1, О2, О3, О6, О10, О11]

